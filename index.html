<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b130e" />
  <title>Selamat Ulang Tahun</title>
  <link rel="icon" href="assets/characters/gasing.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Tenor+Sans&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&family=Source+Sans+3:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="gl" aria-label="Scene 3D koper"></canvas>
    <main id="stage2d"></main>

    <button class="icon-btn fs-btn" id="fsBtn" hidden aria-label="Layar penuh" title="Layar penuh (F)">⛶</button>

    <header class="hud-top">
      <button class="icon-btn" id="muteBtn" hidden aria-label="Musik">♪</button>
    </header>

    <footer class="hud-bottom">
      <div class="pills">
        <div class="pill" id="hint" hidden></div>
        <div class="pill pill-gold" id="counter" hidden></div>
      </div>
      <button class="btn" id="actionBtn" hidden></button>
    </footer>

    <div class="note" id="note" hidden role="dialog" aria-modal="true" aria-labelledby="noteTitle">
      <article class="note-paper">
        <button class="note-close" id="noteClose" aria-label="Tutup catatan">✕</button>
        <h2 id="noteTitle"></h2>
        <p class="note-tagline" id="noteTagline" hidden></p>
        <div class="note-body" id="noteBody"></div>
      </article>
    </div>

    <div class="end-bar" id="endBar" hidden>
      <button class="btn btn-ghost" id="endWatch">↻ Putar ulang</button>
      <button class="btn" id="endRestart">↺ Ulangi dari awal</button>
    </div>

    <div id="flash" aria-hidden="true"></div>
    <div id="fader" aria-hidden="true"></div>
    <div id="confetti" aria-hidden="true"></div>

    <!-- Scene 0: halaman pembuka (panggung stasiun dibangun js/scene0.js) -->
    <section class="start s0" id="start" aria-labelledby="startTitle">
      <h1 class="sr-only" id="startTitle">Sebuah perjalanan kecil untuk Pak Bram</h1>
      <button class="btn" id="startBtn">Mulai Perjalanan →</button>
      <p class="start-tip">Nyalakan suara 🔊 · bisa di HP maupun laptop</p>
    </section>

    <!-- Hanya tampil di HP/tablet saat posisi potret: situs ini harus dilihat mendatar -->
    <div class="rotate-guard" id="rotateGuard" role="alert" aria-live="assertive">
      <div class="rotate-icon" aria-hidden="true">📱</div>
      <p>Putar HP kamu ke mode <b>mendatar</b> (landscape) ya</p>
      <small>Matikan kunci rotasi layar kalau tidak mau berputar</small>
    </div>

    <div class="error" id="error" hidden></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
