<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tas Tenis + Raket 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background: linear-gradient(#e8d5b0, #c9ad80);
      font-family: system-ui, sans-serif; color: #3b2a1a; user-select: none;
    }
    #stage { height: min(88vh, 150vw); aspect-ratio: .55; cursor: grab; touch-action: none; }
    #stage:active { cursor: grabbing; }
    .bag3d { width: 100%; height: 100%; }
    .bag3d > canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .35s; }
    .bag3d > canvas.is-ready { opacity: 1; }
    p { position: fixed; bottom: 12px; margin: 0; font-size: 14px; opacity: .75; text-align: center; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <p>Geser untuk memutar · ketuk untuk menggoyang tas</p>
  <script type="module">
    import { createBag3D } from './js/bag3d.js';
    const stage = document.getElementById('stage');
    const bag = createBag3D({ yaw: 0.45 });
    stage.append(bag);

    let yaw = 0.45, down = null, moved = 0;
    stage.addEventListener('pointerdown', (e) => { down = e.clientX; moved = 0; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', (e) => {
      if (down == null) return;
      yaw += (e.clientX - down) * 0.012; moved += Math.abs(e.clientX - down); down = e.clientX;
      bag.setYaw(yaw);
    });
    stage.addEventListener('pointerup', () => { if (moved < 4) bag.wobble(); down = null; });
  </script>
</body>
</html>
